# Since commons-logging 1.3 the default factory delegates to SLF4J when slf4j-api is on the classpath.
# Tests get slf4j-api transitively without a provider, which yields a NOP logger, so use the classic discovery (JUL).
org.apache.commons.logging.LogFactory=org.apache.commons.logging.impl.LogFactoryImpl
