# A fork profile: what the long Jenkins --globals blob becomes once it is split up.
# Every value that would identify a real environment is an ${env:...} placeholder,
# because this file is committed to a public Apache repository.
#
#   export ISE_USER=... ISE_PASSWORD=...
#   ducktests-remote --profile ise-perf run <test paths>
#
# ${file:PATH} is also available and reads a trimmed single-line file, which is what
# you want for a password kept outside the environment.

globals:
  project: ${env:DTR_PROJECT}

  ignite_versions:
    - ${env:DTR_IGNITE_VERSION}

  ssl:
    enabled: true

  authentication:
    enabled: true
    username: ${env:ISE_USER}
    password: ${env:ISE_PASSWORD}

  # Fork spec override; resolve_spec() in ignitetest/services/utils/ignite_spec.py
  # reads these from globals to swap in the fork's node startup.
  NodeSpec: ${env:DTR_NODE_SPEC}

  # ignitetest defaults: persistent_root /mnt/service, install_root /opt.
  # Override them here when the site layout differs.
  # persistent_root: /data/ducktests
  # install_root: /opt

# Injected into the tests themselves, mapped to ducktape's --parameters.
# Only emitted when non-empty, matching run_tests.sh.
parameters: {}
