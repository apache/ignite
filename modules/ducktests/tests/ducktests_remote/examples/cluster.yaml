# Example cluster inventory. Copy to ~/.ducktests-remote/config.yaml and edit.
# Everything here is a placeholder: this file lives in a public repository, so it
# contains no real hostnames, addresses, accounts or secrets.

cluster:
  name: example

  # SSH account used on every worker. Defaults to your own $USER when omitted.
  # There is no dedicated test account on a real VM cluster unless your site created
  # one; nothing in this tool assumes one exists.
  user: ${env:DTR_SSH_USER}

  # Path to the private key AS THE RUNNER SEES IT, not as this machine sees it.
  # `ducktests-remote keys push` installs it there.
  identity_file: ~/.ssh/id_rsa

  port: 22

  # Where distributions live on the workers. ignitetest resolves a home directory as
  # <install_root>/<product>, product being str(IgniteVersion(version)).
  install_root: /opt

  # Host that runs the ducktape process. "local" runs it on this machine.
  runner: ${env:DTR_RUNNER}

  # Run state (run dirs, logs, the venv) lives here on the runner.
  state_root: ~/.ducktests-remote

  # Any number of workers: 2, 12, 49. Ranges expand, and a bare string is shorthand
  # for {host: ...}.
  nodes:
    - host: worker[01-12].example.invalid
    - host: worker13.example.invalid
      ip: 203.0.113.13            # optional -> externally_routable_ip
    - host: worker14.example.invalid
      user: someone-else          # per-host override for mixed clusters

  # Hosts that provision/deploy/clean/doctor should also target, but that ducktape
  # must not schedule Ignite nodes onto - typically the runner itself.
  extra_hosts: []

runner:
  # Leave unset to use <state_root>/venv, created on first run with the pinned
  # requirements from modules/ducktests/tests/docker/requirements.txt.
  venv: null
  python: python3
  create_venv: true

# Where the runner installs those requirements from. Only the runner ever runs pip;
# workers are driven over plain ssh and need no Python. Leave the whole section out to
# use PyPI. A token in the URL belongs in the environment, not in this file - and
# anything resolved from ${env:} is masked in everything the CLI prints.
pip:
  # index_url: ${env:DTR_PIP_INDEX_URL}       # a missing variable is a hard error, never ""
  # extra_index_url: [https://nexus.example.invalid/repository/pypi-internal/simple]
  # trusted_host: [nexus.example.invalid]     # plain http, or a certificate you cannot fix
  # cert: /etc/pki/tls/certs/corp-ca.pem      # a RUNNER-side path, like identity_file
  timeout: 60
  retries: 5

# Which JVM the workers run the tests under. `major` alone is enough when the VMs already
# carry a suitable JDK somewhere under search_paths; `archive` covers the ones that do not.
java:
  major: 17
  # home: /opt/jdk-17.0.11         # use exactly this JDK, no search
  search_paths: [/opt, /usr/lib/jvm, /usr/java]
  # archive: ~/jdk/OpenJDK17U-jdk_x64_linux_hotspot.tar.gz   # coordinator-side
  # install_root: /opt             # defaults to cluster.install_root
  # name: jdk-17                   # target directory; defaults to the archive's own name
  ssh_environment: true            # write ~/.ssh/environment
  bashrc: true                     # and a marked block at the top of ~/.bashrc

deploy:
  # One subdirectory per distribution. `ignite-dev` is usually a symlink to a checkout:
  #   ln -sfn ~/dev/ignite ./dist/ignite-dev
  dist_dir: ./dist

  # Patterns left out of every distribution, rsync-style. Empty by default, so a release
  # directory is shipped whole. The list below is for the symlinked-checkout case: the
  # workers need modules/*/target/*.jar, modules/*/target/libs/*.jar, bin/ and the
  # ducktests certs, and nothing else in the tree.
  # exclude: [.git, .idea, src, docs, assembly, classes, test-classes,
  #           generated-sources, generated-test-sources, maven-status, maven-archiver,
  #           surefire-reports, javadoc, "*.tar.gz", "*.zip", __pycache__, "*.pyc"]

  # Send only what differs from the deployment already on each host, hardlinking the
  # rest. Falls back to a whole tarball when either end has no rsync, or with --via.
  rsync: true

jobs: 16
