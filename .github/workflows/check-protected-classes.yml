name: Wire format report

on:
  workflow_run:
    workflows: ['Code Style, Abandoned Tests, Javadocs']
    types: [completed]

permissions: {}

jobs:
  report:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: wire-report-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
      queue: max
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Report the wire comparison
        uses: actions/github-script@v8
        with:
          script: |
            const label = 'compatibility';

            const run = context.payload.workflow_run;
            const repo = context.repo;
            const {actions, issues, pulls} = github.rest;
            const only = items => items.length === 1 ? items[0] : undefined;
            const list = (method, params) => github.paginate(method, {...repo, ...params, per_page: 100});

            function findStepConclusion(job, name) {
              return only(job?.steps?.filter(step => step.name === name && step.status === 'completed') ?? [])?.conclusion;
            }

            async function findPullRequestForRun(run) {
              if (!run.head_repository) return;
              if (run.pull_requests?.length) return only(run.pull_requests);

              const head = `${run.head_repository.owner.login}:${run.head_branch}`;
              const candidates = await list(pulls.list, {head, state: 'all'});
              const target = only(candidates.filter(pr => pr.head.repo?.id === run.head_repository.id
                && pr.created_at <= run.created_at && (!pr.closed_at || pr.closed_at >= run.created_at)));
              if (!target || target.state !== 'open' || target.head.sha !== run.head_sha) return;

              const {node} = await github.graphql(`query($id: ID!, $since: DateTime!) {
                node(id: $id) { ... on PullRequest {
                  timelineItems(first: 1, since: $since, itemTypes: [BASE_REF_CHANGED_EVENT]) { nodes { __typename } }
                } }
              }`, {id: target.node_id, since: run.created_at});
              if (node?.timelineItems.nodes.length === 0) return target;
            }

            const jobs = await list(actions.listJobsForWorkflowRun, {run_id: run.id, filter: 'latest'});
            if (jobs.some(job => job.run_attempt > run.run_attempt))
              return core.info('A newer attempt has started.');

            const headJobs = jobs.filter(job => job.head_sha === run.head_sha);
            const wire = only(headJobs.filter(job => job.name === 'Compare wire format descriptions'));
            const java = only(headJobs.filter(job => job.name === 'Check java code on JDK 17'));
            const upload = findStepConclusion(wire, 'Upload wire diff');
            if (wire?.conclusion !== 'success' || findStepConclusion(wire, 'Compare descriptions and publish summary') !== 'success'
              || findStepConclusion(java, 'Check all wire format descriptions are collected') !== 'success'
              || !['success', 'skipped'].includes(upload))
              return core.info('The wire comparison or completeness check could not be verified.');

            const target = await findPullRequestForRun(run);
            if (!target)
              return core.info('Could not identify the PR and its target branch.');

            const issue = {...repo, issue_number: target.number};
            const {data: pr} = await pulls.get({...repo, pull_number: target.number});
            if (pr.state !== 'open' || pr.head.repo?.id !== run.head_repository.id || pr.head.ref !== run.head_branch
              || pr.head.sha !== run.head_sha || pr.base.ref !== target.base.ref)
              return core.info('The PR has closed or changed since the comparison.');

            const labeled = pr.labels.some(l => l.name === label);
            if (upload === 'skipped') {
              if (labeled)
                await issues.removeLabel({...issue, name: label});

              return;
            }

            if (!labeled)
              await issues.addLabels({...issue, labels: [label]});

            const url = `${run.html_url}/attempts/${wire.run_attempt}#summary-${wire.id}`;
            const body = `Wire format changed. Review the [wire diff in Job Summary](${url}) for rolling upgrade compatibility.`;
            await issues.createComment({...issue, body});
