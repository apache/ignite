name: Wire format report

on:
  workflow_run:
    workflows: ['Code Style, Abandoned Tests, Javadocs']
    types: [completed]

permissions: {}

jobs:
  report:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: wire-report-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
      queue: max
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Report the wire comparison
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- ignite-rolling-upgrade-check -->';
            const label = 'compatibility';

            const run = context.payload.workflow_run;
            const repo = context.repo;
            const {actions, issues, pulls} = github.rest;
            const only = items => items.length === 1 ? items[0] : undefined;
            const list = (method, params) => github.paginate(method, {...repo, ...params, per_page: 100});

            function stepResult(job, name) {
              return only(job?.steps?.filter(step => step.name === name && step.status === 'completed') ?? [])?.conclusion;
            }

            function comparison(jobs, attempt) {
              // A partial rerun keeps the jobs that were not rerun from earlier attempts.
              function latestJob(name) {
                const matches = jobs.filter(job => job.name === name && job.head_sha === run.head_sha && job.run_attempt <= attempt);
                const latest = Math.max(...matches.map(job => job.run_attempt));
                return only(matches.filter(job => job.run_attempt === latest));
              }

              const wire = latestJob('Compare wire format descriptions');
              const java = latestJob('Check java code on JDK 17');
              const upload = stepResult(wire, 'Upload wire diff');
              if (wire?.conclusion === 'success' && stepResult(wire, 'Compare descriptions and publish summary') === 'success'
                && stepResult(java, 'Check all wire format descriptions are collected') === 'success'
                && ['success', 'skipped'].includes(upload))
                return {wire, upload};
            }

            async function targetOf(run) {
              if (!run.head_repository) return;
              if (run.pull_requests?.length) return only(run.pull_requests);

              // Fork runs can omit pull_requests. Match the source branch to a single PR open at run creation.
              const head = `${run.head_repository.owner.login}:${run.head_branch}`;
              const candidates = await list(pulls.list, {head, state: 'all'});
              const target = only(candidates.filter(pr => pr.head.repo?.id === run.head_repository.id
                && pr.created_at <= run.created_at && (!pr.closed_at || pr.closed_at >= run.created_at)));
              if (!target || target.state !== 'open' || target.head.sha !== run.head_sha) return;

              const {node} = await github.graphql(`query($id: ID!, $since: DateTime!) {
                node(id: $id) { ... on PullRequest {
                  timelineItems(first: 1, since: $since, itemTypes: [BASE_REF_CHANGED_EVENT]) { nodes { __typename } }
                } }
              }`, {id: target.node_id, since: run.created_at});
              if (node?.timelineItems.nodes.length === 0) return target;
            }

            const jobs = await list(actions.listJobsForWorkflowRun, {run_id: run.id, filter: 'latest'});
            if (jobs.some(job => job.run_attempt > run.run_attempt))
              return core.info('A newer attempt has started.');

            const {wire, upload} = comparison(jobs, run.run_attempt) ?? {};
            if (!wire)
              return core.info('The wire comparison or completeness check could not be verified.');

            const target = await targetOf(run);
            if (!target)
              return core.info('Could not identify the PR and its target branch.');

            // An empty report leaves no comment. Check CI history for newer verified results on this PR and base.
            const runs = await list(actions.listWorkflowRuns, {
              workflow_id: run.workflow_id, event: 'pull_request', branch: run.head_branch,
              head_sha: run.head_sha, created: `>=${run.created_at}`,
            });
            for (const newer of runs) {
              if (newer.run_number <= run.run_number || newer.head_repository?.id !== run.head_repository.id) continue;
              const lastCompletedAttempt = newer.status === 'completed' ? newer.run_attempt : newer.run_attempt - 1;
              if (!lastCompletedAttempt) continue;

              const newerTarget = await targetOf(newer);
              if (newerTarget?.number !== target.number || newerTarget.base.ref !== target.base.ref) continue;

              const history = await list(actions.listJobsForWorkflowRun, {run_id: newer.id, filter: 'all'});
              for (let attempt = lastCompletedAttempt; attempt >= 1; attempt--) {
                if (comparison(history, attempt))
                  return core.info(`Newer run ${newer.id} already has a verified wire comparison.`);
              }
            }

            const issue = {...repo, issue_number: target.number};
            const comments = await list(issues.listComments, issue);
            const comment = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.startsWith(marker));

            const {data: pr} = await pulls.get({...repo, pull_number: target.number});
            if (pr.state !== 'open' || pr.head.repo?.id !== run.head_repository.id || pr.head.ref !== run.head_branch
              || pr.head.sha !== run.head_sha || pr.base.ref !== target.base.ref)
              return core.info('The PR has closed or changed since the comparison.');

            const labeled = pr.labels.some(l => l.name === label);
            if (upload === 'skipped') {
              if (labeled)
                await issues.removeLabel({...issue, name: label});

              if (comment)
                await issues.deleteComment({...repo, comment_id: comment.id});
              return;
            }

            if (!labeled)
              await issues.addLabels({...issue, labels: [label]});

            const url = `${run.html_url}/attempts/${wire.run_attempt}#summary-${wire.id}`;
            const body = `${marker}\nWire format changed. Review the [wire diff in Job Summary](${url}) for rolling upgrade compatibility.`;
            if (!comment)
              await issues.createComment({...issue, body});
            else if (comment.body !== body)
              await issues.updateComment({...repo, comment_id: comment.id, body});
