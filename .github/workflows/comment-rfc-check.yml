name: Report RFC check in PR

on:
  workflow_run:
    workflows: [RFC check]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  prepare:
    if: >-
      contains(fromJSON('["pull_request", "pull_request_review"]'), github.event.workflow_run.event) &&
      contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pr_number: ${{ steps.source.outputs.pr_number }}
      outcome: ${{ steps.evidence.outcome }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Find the open PR at the checked revision
        id: source
        run: python3 .github/scripts/rfc_comment.py prepare "$RUNNER_TEMP/rfc-pr.json"
      # Use the same trusted checker revision as the PR check.
      - uses: actions/checkout@v4
        if: steps.source.outputs.pr_number != ''
        with:
          ref: ${{ steps.source.outputs.base_sha }}
          path: rfc-base
          sparse-checkout: |
            .github/scripts
            rfcs
          persist-credentials: false
      - name: Check the current evidence for the comment
        id: evidence
        if: steps.source.outputs.pr_number != ''
        continue-on-error: true
        working-directory: rfc-base
        run: |
          GITHUB_EVENT_PATH="$RUNNER_TEMP/rfc-pr.json" GITHUB_STEP_SUMMARY="$RUNNER_TEMP/rfc-result.md" \
            python3 .github/scripts/check_rfc.py
      - name: Save the report for this workflow run
        if: steps.evidence.outcome == 'success' || steps.evidence.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rfc-comment
          path: |
            ${{ runner.temp }}/rfc-pr.json
            ${{ runner.temp }}/rfc-result.md
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  comment:
    needs: prepare
    if: needs.prepare.outputs.pr_number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
    concurrency:
      group: rfc-comment-pr-${{ needs.prepare.outputs.pr_number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      # Only download the report generated by the trusted job above.
      - uses: actions/download-artifact@v4
        with:
          name: rfc-comment
          path: ${{ runner.temp }}
      - name: Report changes in the PR
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_OUTCOME: ${{ needs.prepare.outputs.outcome }}
        run: python3 .github/scripts/rfc_comment.py publish "$RUNNER_TEMP/rfc-pr.json" "$RUNNER_TEMP/rfc-result.md" "$CHECK_OUTCOME"
