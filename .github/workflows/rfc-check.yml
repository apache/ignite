name: RFC check

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: rfc-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    # An inactive job must not satisfy a branch rule that requires "RFC process".
    name: ${{ vars.IGNITE_RFC_CHECK == 'true' && 'RFC process' || 'RFC process (disabled)' }}
    if: vars.IGNITE_RFC_CHECK == 'true' && github.event.pull_request.base.ref == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: |
            .github/scripts
            rfcs
          persist-credentials: false
      - name: Check RFC evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/check_rfc.py
