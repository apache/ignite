name: RFC check
run-name: 'RFC check for PR #${{ github.event.pull_request.number }}'

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: rfc-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  base:
    name: Check RFC workflow installation
    if: github.event.pull_request.base.ref == 'master'
    runs-on: ubuntu-slim
    outputs:
      installed: ${{ steps.workflow.outputs.installed }}
    steps:
      - id: workflow
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          installed=$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows?ref=$BASE_SHA" \
            --jq 'any(.[]; .name == "rfc-check.yml")')
          echo "installed=$installed" >> "$GITHUB_OUTPUT"
          if [[ "$installed" == false ]]; then
            echo "The base commit has no RFC workflow. After the checker lands on master, test a new or updated PR before requiring this check." >> "$GITHUB_STEP_SUMMARY"
          fi

  check:
    needs: base
    name: ${{ needs.base.outputs.installed == 'true' && 'RFC process' || 'RFC process (inactive)' }}
    if: needs.base.outputs.installed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: |
            .github/scripts
            rfcs
          persist-credentials: false
      - name: Check RFC evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/check_rfc.py
