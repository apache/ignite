name: Public behavior changes
run-name: 'Public behavior changes for PR #${{ github.event.pull_request.number }}'

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: public-behavior-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  base:
    name: Check whether the public behavior check is installed
    if: github.event.pull_request.base.ref == 'master'
    runs-on: ubuntu-slim
    outputs:
      installed: ${{ steps.workflow.outputs.installed }}
    steps:
      - id: workflow
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          installed=$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows?ref=$BASE_SHA" \
            --jq 'any(.[]; .name == "check-public-behavior.yml")')
          echo "installed=$installed" >> "$GITHUB_OUTPUT"
          if [[ "$installed" == false ]]; then
            cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          The public behavior check is not installed on this base commit. After it lands on master, test it on a new or updated PR before requiring it.

          The check flags known contract paths. Reviewers decide whether supported behavior changes. See [public contracts](https://github.com/apache/ignite/blob/master/rfcs/IGNITE-29219-public-api-and-compatibility.md) and [the RFC process](https://github.com/apache/ignite/pull/13760/files#diff-964c536dd887c02e46887244405c46d2d8b5e15dc7a4480eb3a33fb64844b15a).
          EOF
          fi

  check:
    needs: base
    name: ${{ needs.base.outputs.installed == 'true' && 'Public behavior changes' || 'Public behavior changes (inactive)' }}
    if: needs.base.outputs.installed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: |
            .github/public-behavior
            rfcs
          persist-credentials: false
      - name: Check public behavior changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/public-behavior/check_pull_request.py
