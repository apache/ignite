name: Public behavior changes comment

# workflow_run runs this file from master with a token that can write to PRs. It never checks out or runs PR code:
# the result of the "Public behavior changes" run is validated as data, and the comment is rendered here.
on:
  workflow_run:
    workflows: [Public behavior changes]
    types: [completed]

permissions: {}

# Publishes the results of one PR in the order their runs completed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  comment:
    name: Comment on public behavior changes
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      contains(fromJSON('["success", "failure", "timed_out"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Checkout check scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/public-behavior
          persist-credentials: false

      - name: Download result
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: public-behavior-changes
          path: result
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Update PR comment
        uses: actions/github-script@v8
        with:
          script: |
            const check = require('./.github/public-behavior/check.js');
            await check.publish({ github, context, core, resultFile: 'result/result.json' });
