name: Report public behavior changes in PR

on:
  workflow_run:
    workflows: [Public behavior changes]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  prepare:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      contains(fromJSON('["success", "failure", "timed_out"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pr_number: ${{ steps.source.outputs.pr_number }}
      outcome: ${{ steps.source.outputs.conclusion == 'timed_out' && 'timed_out' || steps.evidence.outcome }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/public-behavior
          persist-credentials: false
      - name: Find the open PR at the checked revision
        id: source
        run: python3 .github/public-behavior/post_pr_comment.py prepare "$RUNNER_TEMP/public-behavior-pr.json"
      # Use the same trusted checker revision as the PR check.
      - uses: actions/checkout@v4
        if: steps.source.outputs.pr_number != '' && steps.source.outputs.conclusion != 'timed_out'
        with:
          ref: ${{ steps.source.outputs.base_sha }}
          path: public-behavior-base
          sparse-checkout: |
            .github/public-behavior
            rfcs
          persist-credentials: false
      - name: Check the current PR for the comment
        id: evidence
        if: steps.source.outputs.pr_number != '' && steps.source.outputs.conclusion != 'timed_out'
        continue-on-error: true
        working-directory: public-behavior-base
        run: |
          GITHUB_EVENT_PATH="$RUNNER_TEMP/public-behavior-pr.json" GITHUB_STEP_SUMMARY="$RUNNER_TEMP/public-behavior-result.md" \
            python3 .github/public-behavior/check_pull_request.py
      - name: Save the report for this workflow run
        if: steps.evidence.outcome == 'success' || steps.evidence.outcome == 'failure' || steps.source.outputs.conclusion == 'timed_out'
        uses: actions/upload-artifact@v4
        with:
          name: public-behavior-comment
          path: |
            ${{ runner.temp }}/public-behavior-pr.json
            ${{ runner.temp }}/public-behavior-result.md
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  comment:
    needs: prepare
    if: needs.prepare.outputs.pr_number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
    concurrency:
      group: public-behavior-comment-pr-${{ needs.prepare.outputs.pr_number }}
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            .github/public-behavior
            rfcs
          persist-credentials: false
      # Only download the report generated by the trusted job above.
      - uses: actions/download-artifact@v4
        with:
          name: public-behavior-comment
          path: ${{ runner.temp }}
      - name: Report changes in the PR
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_OUTCOME: ${{ needs.prepare.outputs.outcome }}
        run: python3 .github/public-behavior/post_pr_comment.py publish "$RUNNER_TEMP/public-behavior-pr.json" "$RUNNER_TEMP/public-behavior-result.md" "$CHECK_OUTCOME"
