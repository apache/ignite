name: Report wire format changes

on:
  workflow_run:
    workflows: ['Code Style, Abandoned Tests, Javadocs']
    types: [completed]

permissions: {}

jobs:
  report:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.path == '.github/workflows/commit-check.yml'
    runs-on: ubuntu-latest
    concurrency:
      group: wire-report-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
      queue: max
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      # On workflow_run, github.sha is a commit from the default branch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - uses: actions/github-script@v8
        with:
          script: |
            await require('./.github/scripts/report-wire-changes.js')({github, context, core});
